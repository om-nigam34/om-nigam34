<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Om Nigam, B.Tech ECE, Software and AI/ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- twinkling dots -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="2" opacity="0.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="120" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="2" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="150" r="1.5" opacity="0.5"><animate attributeName="opacity" values="1;0.1;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="2" opacity="0.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="125" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="45" r="2" opacity="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="110" r="1.5" opacity="0.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- slow moving waves -->
  <path fill="#0D1117" fill-opacity="0.35" d="M0 175 Q125 150 250 175 T500 175 T750 175 T1000 175 T1250 175 T1500 175 T1750 175 T2000 175 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="16s" repeatCount="indefinite"/>
  </path>
  <path fill="#0D1117" fill-opacity="0.6" d="M0 195 Q125 175 250 195 T500 195 T750 195 T1000 195 T1250 195 T1500 195 T1750 195 T2000 195 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="22s" repeatCount="indefinite"/>
  </path>

  <!-- name and subtitle -->
  <text x="500" y="105" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" opacity="1">
    Om Nigam
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="145" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#E6EDF3" opacity="1">
    B.Tech ECE  |  Software &amp; AI/ML
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
